[package]
name = "bruma"
description = "CLI del motor bruma: run, install, new, validate, list"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
readme = "../../README.md"
publish = false

[dependencies]
bruma-core.workspace = true
bruma-package = { version = "0.1.0", path = "../bruma-package" }
bruma-platform.workspace = true
bruma-renderer-wgpu.workspace = true
bruma-runtime = { version = "0.1.0", path = "../bruma-runtime" }
log = "0.4.34"
# Config del servicio (Fase 5): mismo crate que ya usa bruma-package
# para el manifiesto — cero dependencias nuevas (D8).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
# Template validation in tests: same WGSL compiler/validator the engine
# runs (naga rides in the tree via wgpu — no new code, D8).
naga = { version = "30.0.1", features = ["wgsl-in"] }
