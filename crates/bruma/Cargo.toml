[package]
name = "bruma"
description = "CLI del motor bruma: run, install, new, validate, list"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
readme = "../../README.md"
publish = false

[dependencies]
bruma-core.workspace = true
bruma-package = { version = "0.1.0", path = "../bruma-package" }
bruma-platform.workspace = true
bruma-renderer-wgpu.workspace = true
bruma-runtime = { version = "0.1.0", path = "../bruma-runtime" }
log = "0.4.34"
# Config del servicio (Fase 5): mismo crate que ya usa bruma-package
# para el manifiesto — cero dependencias nuevas (D8).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `bruma params` SIGHUPs the running daemon for live tuning; the
# platform crate already carries libc for the sigaction side.
libc = "0.2"
# `bruma studio` validates shader edits with the same WGSL validator
# the engine runs before writing (naga rides in the tree via wgpu —
# no new code, D8).
naga = { version = "30.0.1", features = ["wgsl-in"] }
# `bruma studio` sniffs uploaded image bytes (texture slot + preview)
# before writing them into the package — the `image` crate is already
# in the tree via the renderer (D8).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# Base64 decode of the studio's photo uploads (single-purpose, tiny).
base64 = "0.22"

[dev-dependencies]
